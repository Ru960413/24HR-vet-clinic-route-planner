version: 2
updates:
  # keep requirements.txt current
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]   # one combined PR instead of one per package
    open-pull-requests-limit: 5

  # keep the workflow's actions (checkout, setup-python) current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
