name: Monthly clinic data check

on:
  schedule:
    - cron: "0 22 1 * *"   # 1st of every month, 06:00 Taipei time
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check clinic data drift
        env:
          MAPS_KEY: ${{ secrets.MAPS_KEY }}
        run: python scripts/check_updates.py
      - name: Open notification issue
        if: ${{ hashFiles('report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "診所資料異動通知 $(date +%Y-%m)" \
            --body-file report.md
