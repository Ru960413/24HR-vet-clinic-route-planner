<!DOCTYPE html>
<html lang="{{ 'zh-Hant-TW' if lang|default('zh') == 'zh' else 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>{% block title %}{% endblock title %}</title>
    <meta name="description" content="{% block description %}24-hour emergency veterinary clinics in Taiwan — full list with night ER hours, phones and navigation.{% endblock description %}" />
    <meta property="og:site_name" content="全台24小時急診獸醫院地圖 | 24HR Vet Clinics in Taiwan" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ self.title() }}" />
    <meta property="og:description" content="{{ self.description() }}" />
    {% block meta %}{% endblock meta %}
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/static/index.css" rel="stylesheet" />
    {% block link %}{% endblock link %}
    {% block style %}{% endblock style %}
  </head>

  <body>
    <div class="info-container">
      {% block content %}{% endblock content %}
    </div>
    {% block script %}{% endblock script %}
    <script data-goatcounter="https://vetmap.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>

  <footer>
    <p><a href="/about/{{ lang|default('zh') }}" class="footer-link">Made with 🐾 by Laisa & 夜燈</a></p>
  </footer>
</html>
